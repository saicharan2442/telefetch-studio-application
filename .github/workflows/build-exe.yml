name: Build Electron Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Build Next.js app
        run: npm run build

      - name: Create .env file from Secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.TELEGRAM_API_ID }}" ] && [ -n "${{ secrets.TELEGRAM_API_HASH }}" ]; then
            echo "TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}" > .env
            echo "TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}" >> .env
          fi

      - name: Build Electron app
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TeleFetchStudio-Windows
          path: dist/*.exe
